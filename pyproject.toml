[project]
name = "webblock-harness"
version = "0.1.0"
description = "WebBlock hybrid website-generation harness (FastAPI)"
authors = [
    { name = "Soeun-Sovannarith", email = "soeunsovannarith64@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
webblock-harness = "webblock_harness.api.app:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 130
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "E501", "SIM108", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE"]

[tool.mypy]
python_version = "3.14"
packages = ["webblock_harness"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
